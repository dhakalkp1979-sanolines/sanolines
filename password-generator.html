<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secure Password Generator – Sanolines</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<header>
  <div class="logo">
    <a href="/">
      <img src="../logo.svg" alt="Sanolines Logo">
    </a>
  </div>
  <nav>
    <a href="/">Home</a>
    <a href="/tools.html">Tools</a>
    <a href="/categories.html">Categories</a>
    <a href="/about.html">About</a>
    <a href="/disclaimer.html">Disclaimer</a>
    <button id="theme-toggle" style="background: none; border: none; cursor: pointer; font-size: 1.1rem; color: inherit;">🌙</button>
  </nav>
</header>

<main class="fade" style="max-width: 600px;">
  <h1>Secure Password Generator</h1>
  <p style="color: var(--text-muted); margin-bottom: 24px;">Generate strong, random passwords to keep your accounts secure.</p>

  <div class="card" style="padding: 24px;">
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
      <input type="text" id="password-output" readonly placeholder="Your password will appear here" style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); font-family: monospace; font-size: 1.1rem;">
      <button onclick="copyPassword()" style="background: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border-color); padding: 0 16px; border-radius: 8px; cursor: pointer; font-weight: 600;">Copy</button>
    </div>

    <div style="margin-bottom: 16px;">
      <label style="display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 6px;">
        <span>Length: <strong id="length-val">16</strong></span>
      </label>
      <input type="range" id="length" min="8" max="32" value="16" oninput="document.getElementById('length-val').textContent = this.value" style="width: 100%; accent-color: #2563eb;">
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; font-size: 0.95rem;">
      <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
        <input type="checkbox" id="uppercase" checked style="width: 16px; height: 16px; accent-color: #2563eb;"> Include Uppercase Letters (A-Z)
      </label>
      <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
        <input type="checkbox" id="lowercase" checked style="width: 16px; height: 16px; accent-color: #2563eb;"> Include Lowercase Letters (a-z)
      </label>
      <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
        <input type="checkbox" id="numbers" checked style="width: 16px; height: 16px; accent-color: #2563eb;"> Include Numbers (0-9)
      </label>
      <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
        <input type="checkbox" id="symbols" checked style="width: 16px; height: 16px; accent-color: #2563eb;"> Include Symbols (!@#$%^&*)
      </label>
    </div>

    <button onclick="generatePassword()" style="background: var(--accent-gradient); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1rem; font-weight: 600;">Generate Password</button>

    <div id="copy-status" style="margin-top: 12px; text-align: center; font-size: 0.85rem; color: #10b981; height: 20px;"></div>
  </div>
</main>

<footer>
  <div>
    <a href="/about.html">About</a> | 
    <a href="/privacy.html">Privacy Policy</a> | 
    <a href="/terms.html">Terms</a> | 
    <a href="/disclaimer.html">Disclaimer</a>
  </div>
  <div style="margin-top: 8px;">© 2026 Sanolines — All Rights Reserved</div>
</footer>

<script>
  function generatePassword() {
    const length = parseInt(document.getElementById("length").value);
    const hasUpper = document.getElementById("uppercase").checked;
    const hasLower = document.getElementById("lowercase").checked;
    const hasNums = document.getElementById("numbers").checked;
    const hasSyms = document.getElementById("symbols").checked;

    const upperChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const lowerChars = "abcdefghijklmnopqrstuvwxyz";
    const numChars = "0123456789";
    const symChars = "!@#$%^&*()_+-=[]{}|;:,.<>?";

    let validChars = "";
    if (hasUpper) validChars += upperChars;
    if (hasLower) validChars += lowerChars;
    if (hasNums) validChars += numChars;
    if (hasSyms) validChars += symChars;

    const outputBox = document.getElementById("password-output");
    const statusBox = document.getElementById("copy-status");
    statusBox.textContent = "";

    if (!validChars) {
      outputBox.value = "";
      statusBox.textContent = "Please select at least one character type.";
      statusBox.style.color = "#ef4444";
      return;
    }

    statusBox.style.color = "#10b981";
    let password = "";
    for (let i = 0; i < length; i++) {
      const randomIndex = Math.floor(Math.random() * validChars.length);
      password += validChars[randomIndex];
    }

    outputBox.value = password;
  }

  function copyPassword() {
    const outputBox = document.getElementById("password-output");
    const statusBox = document.getElementById("copy-status");
    
    if (!outputBox.value) return;

    navigator.clipboard.writeText(outputBox.value).then(() => {
      statusBox.textContent = "✓ Password copied to clipboard!";
      setTimeout(() => { statusBox.textContent = ""; }, 2500);
    });
  }

  // Generate one on initial load
  window.onload = generatePassword;

  // Dark Mode Persistence Logic
  const toggleBtn = document.getElementById("theme-toggle");
  const applyTheme = (isDark) => {
    document.body.classList.toggle("dark", isDark);
    toggleBtn.textContent = isDark ? "☀️" : "🌙";
    localStorage.setItem("theme", isDark ? "dark" : "light");
  };
  if (toggleBtn) toggleBtn.addEventListener("click", () => applyTheme(!document.body.classList.contains("dark")));
  if (localStorage.getItem("theme") === "dark") applyTheme(true);
</script>

</body>
</html>
