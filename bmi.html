<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BMI Calculator – Sanolines</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<header>
  <div class="logo">
    <a href="/">
      <img src="../logo.svg" alt="Sanolines Logo">
    </a>
  </div>
  <nav>
    <a href="/">Home</a>
    <a href="/tools.html">Tools</a>
    <a href="/categories.html">Categories</a>
    <a href="/about.html">About</a>
    <a href="/disclaimer.html">Disclaimer</a>
    <button id="theme-toggle" style="background: none; border: none; cursor: pointer; font-size: 1.1rem; color: inherit;">🌙</button>
  </nav>
</header>

<main class="fade" style="max-width: 600px;">
  <h1>BMI Calculator</h1>
  <p style="color: var(--text-muted); margin-bottom: 24px;">Calculate your Body Mass Index quickly and accurately.</p>

  <div class="card" style="padding: 24px;">
    <div style="margin-bottom: 16px;">
      <label style="display: block; font-size: 0.9rem; margin-bottom: 6px;">Weight (kg)</label>
      <input type="number" id="weight" placeholder="e.g. 70" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary);">
    </div>

    <div style="margin-bottom: 20px;">
      <label style="display: block; font-size: 0.9rem; margin-bottom: 6px;">Height (cm)</label>
      <input type="number" id="height" placeholder="e.g. 175" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary);">
    </div>

    <button onclick="calculateBMI()" style="background: var(--accent-gradient); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1rem;">Calculate BMI</button>

    <div id="result" style="margin-top: 20px; font-weight: 600; text-align: center; font-size: 1.1rem;"></div>
  </div>
</main>

<footer>
  <div>
    <a href="/about.html">About</a> | 
    <a href="/privacy.html">Privacy Policy</a> | 
    <a href="/terms.html">Terms</a> | 
    <a href="/disclaimer.html">Disclaimer</a>
  </div>
  <div style="margin-top: 8px;">© 2026 Sanolines — All Rights Reserved</div>
</footer>

<script>
  function calculateBMI() {
    const weight = parseFloat(document.getElementById("weight").value);
    const heightCm = parseFloat(document.getElementById("height").value);
    const resultDiv = document.getElementById("result");

    if (!weight || !heightCm || weight <= 0 || heightCm <= 0) {
      resultDiv.textContent = "Please enter valid weight and height values.";
      return;
    }

    const heightM = heightCm / 100;
    const bmi = (weight / (heightM * heightM)).toFixed(1);
    
    let category = "";
    if (bmi < 18.5) category = "Underweight";
    else if (bmi >= 18.5 && bmi < 24.9) category = "Normal weight";
    else if (bmi >= 25 && bmi < 29.9) category = "Overweight";
    else category = "Obese";

    resultDiv.innerHTML = `Your BMI is ${bmi} <span style="color: var(--text-muted); font-weight: normal;">(${category})</span>`;
  }

  // Dark Mode Persistence Logic
  const toggleBtn = document.getElementById("theme-toggle");
  const applyTheme = (isDark) => {
    document.body.classList.toggle("dark", isDark);
    toggleBtn.textContent = isDark ? "☀️" : "🌙";
    localStorage.setItem("theme", isDark ? "dark" : "light");
  };
  if (toggleBtn) toggleBtn.addEventListener("click", () => applyTheme(!document.body.classList.contains("dark")));
  if (localStorage.getItem("theme") === "dark") applyTheme(true);
</script>

</body>
</html>
