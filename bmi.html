<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BMI Calculator – Sanolines</title>
  <link rel="stylesheet" href="../style.css">
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- Header -->
<header style="display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: var(--bg-primary); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000;">
  <div class="logo">
    <a href="../index.html" style="display: flex; align-items: center; text-decoration: none;">
      <img src="../logo.svg" alt="Sanolines Logo" style="height: 32px; width: auto;">
    </a>
  </div>
  <nav style="display: flex; align-items: center; gap: 24px;">
    <a href="../index.html" style="text-decoration: none; color: var(--text-muted);">Home</a>
    <a href="../tools.html" style="text-decoration: none; color: var(--text-muted);">Tools</a>
    <a href="../categories.html" style="text-decoration: none; color: var(--text-muted);">Categories</a>
    <a href="../about.html" style="text-decoration: none; color: var(--text-muted);">About</a>
    <a href="../disclaimer.html" style="text-decoration: none; color: var(--text-muted);">Disclaimer</a>
  </nav>
  <div style="display: flex; align-items: center; gap: 16px;">
    <!-- Language Switcher -->
    <div style="display: flex; background: var(--bg-secondary); border-radius: 6px; padding: 2px; border: 1px solid var(--border-color);">
      <button onclick="setLanguage('en')" id="lang-en" style="background: #2563eb; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; cursor: pointer;">EN</button>
      <button onclick="setLanguage('pt')" id="lang-pt" style="background: none; color: var(--text-muted); border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; cursor: pointer;">PT</button>
      <button onclick="setLanguage('hi')" id="lang-hi" style="background: none; color: var(--text-muted); border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; cursor: pointer;">HI</button>
    </div>
    <button id="theme-toggle" style="background: none; border: none; cursor: pointer; font-size: 1.2rem; color: inherit;">🌙</button>
  </div>
</header>

<main class="fade" style="max-width: 600px; margin: 40px auto; padding: 0 20px;">
  <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 8px;">BMI Calculator</h1>
  <p style="color: var(--text-muted); margin-bottom: 24px;">Calculate your Body Mass Index quickly and accurately.</p>

  <div class="card" style="padding: 24px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 12px;">
    <div style="margin-bottom: 16px;">
      <label style="display: block; font-size: 0.9rem; margin-bottom: 6px;">Weight (kg)</label>
      <input type="number" id="weight" placeholder="e.g. 70" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); outline: none;">
    </div>

    <div style="margin-bottom: 20px;">
      <label style="display: block; font-size: 0.9rem; margin-bottom: 6px;">Height (cm)</label>
      <input type="number" id="height" placeholder="e.g. 175" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); outline: none;">
    </div>

    <button onclick="calculateBMI()" style="background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1rem; font-weight: 600;">Calculate BMI</button>

    <div id="result" style="margin-top: 20px; font-weight: 600; text-align: center; font-size: 1.1rem;"></div>
  </div>
</main>

<!-- Footer -->
<footer style="background: #0f172a; color: #94a3b8; padding: 40px 5%; margin-top: 60px;">
  <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;">
    <div>
      <img src="../logo.svg" alt="Sanolines Logo" style="height: 28px; width: auto; filter: brightness(0) invert(1); margin-bottom: 8px;">
      <p style="margin: 0; font-size: 0.85rem;">Tools for a Smarter You</p>
    </div>
    <div style="display: flex; gap: 20px; font-size: 0.9rem;">
      <a href="../about.html" style="color: #94a3b8; text-decoration: none;">About</a>
      <a href="../privacy.html" style="color: #94a3b8; text-decoration: none;">Privacy Policy</a>
      <a href="../terms.html" style="color: #94a3b8; text-decoration: none;">Terms</a>
      <a href="../disclaimer.html" style="color: #94a3b8; text-decoration: none;">Disclaimer</a>
    </div>
  </div>
  <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #1e293b; font-size: 0.85rem; text-align: center;">
    © 2026 Sanolines — All Rights Reserved
  </div>
</footer>

<script>
  function calculateBMI() {
    const weight = parseFloat(document.getElementById("weight").value);
    const heightCm = parseFloat(document.getElementById("height").value);
    const resultDiv = document.getElementById("result");

    if (!weight || !heightCm || weight <= 0 || heightCm <= 0) {
      resultDiv.textContent = "Please enter valid weight and height values.";
      return;
    }

    const heightM = heightCm / 100;
    const bmi = (weight / (heightM * heightM)).toFixed(1);
    
    let category = "";
    if (bmi < 18.5) category = "Underweight";
    else if (bmi >= 18.5 && bmi < 24.9) category = "Normal weight";
    else if (bmi >= 25 && bmi < 29.9) category = "Overweight";
    else category = "Obese";

    resultDiv.innerHTML = `Your BMI is ${bmi} <span style="color: var(--text-muted); font-weight: normal;">(${category})</span>`;
  }

  // Dark Mode Persistence Logic
  const toggleBtn = document.getElementById("theme-toggle");
  const applyTheme = (isDark) => {
    document.body.classList.toggle("dark", isDark);
    if(toggleBtn) toggleBtn.textContent = isDark ? "☀️" : "🌙";
    localStorage.setItem("theme", isDark ? "dark" : "light");
  };
  if (toggleBtn) toggleBtn.addEventListener("click", () => applyTheme(!document.body.classList.contains("dark")));
  if (localStorage.getItem("theme") === "dark") applyTheme(true);

  // Language Switcher Placeholder Handler
  function setLanguage(lang) {
    ['en', 'pt', 'hi'].forEach(l => {
      const btn = document.getElementById(`lang-${l}`);
      if (btn) {
        if (l === lang) {
          btn.style.background = "#2563eb";
          btn.style.color = "white";
        } else {
          btn.style.background = "none";
          btn.style.color = "var(--text-muted)";
        }
      }
    });
    localStorage.setItem("selectedLang", lang);
  }

  const savedLang = localStorage.getItem("selectedLang");
  if (savedLang) {
    setLanguage(savedLang);
  }
</script>

</body>
</html>
