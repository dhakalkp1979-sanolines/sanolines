<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Slug Generator – Sanolines</title>
  <link rel="icon" type="image/svg+xml" href="./logo.svg">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<header style="display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background: var(--bg-primary); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000;">
  <div class="logo">
    <a href="./index.html">
      <img src="./logo.svg" alt="Sanolines Logo" style="height: 32px; width: auto;">
    </a>
  </div>
  <nav style="display: flex; align-items: center; gap: 24px;">
    <a href="./index.html" style="text-decoration: none; color: var(--text-muted);">Home</a>
    <a href="./tools.html" style="text-decoration: none; color: var(--text-primary); font-weight: 600;">Tools</a>
    <a href="./categories.html" style="text-decoration: none; color: var(--text-muted);">Categories</a>
    <a href="./about.html" style="text-decoration: none; color: var(--text-muted);">About</a>
    <button id="theme-toggle" style="background: none; border: none; cursor: pointer; font-size: 1.1rem; color: inherit;">🌙</button>
  </nav>
</header>

<main style="padding: 40px 5%; max-width: 900px; margin: 0 auto;">
  <h1 style="font-size: 2.2rem; font-weight: 800; margin-bottom: 8px; color: var(--text-primary);">URL Slug Generator</h1>
  <p style="color: var(--text-muted); margin-bottom: 30px;">Convert article titles or strings into clean, SEO-friendly URL slugs instantly.</p>

  <div style="background: var(--bg-primary); border: 1px solid var(--border-color); padding: 30px; border-radius: 12px;">
    
    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-primary);">Title or Text</label>
      <input type="text" id="inputText" placeholder="e.g., My Awesome Blog Post Title! (2026)" oninput="generateSlug()" style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-secondary, #f8fafc); color: inherit;">
    </div>

    <div style="margin-bottom: 10px;">
      <label style="display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-primary);">Generated Slug Output</label>
      <input type="text" id="outputText" readonly placeholder="slug-output-will-appear-here" style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-secondary, #f1f5f9); color: inherit; font-family: monospace;">
    </div>

  </div>
</main>

<footer style="background: #0f172a; color: #94a3b8; padding: 30px 5%; margin-top: 60px;">
  <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
    <div>
      <a href="./about.html" style="color: #94a3b8; text-decoration: none;">About</a> | 
      <a href="./privacy.html" style="color: #94a3b8; text-decoration: none;">Privacy Policy</a> | 
      <a href="./terms.html" style="color: #94a3b8; text-decoration: none;">Terms</a> | 
      <a href="./disclaimer.html" style="color: #94a3b8; text-decoration: none;">Disclaimer</a>
    </div>
    <div style="font-size: 0.85rem;">© 2026 Sanolines — All Rights Reserved</div>
  </div>
</footer>

<script>
  function generateSlug() {
    const text = document.getElementById('inputText').value;
    
    const slug = text
      .toLowerCase()
      .trim()
      .normalize('NFD') // Split accented characters into independent accents
      .replace(/[\u0300-\u036f]/g, '') // Remove accents
      .replace(/[^\w\s-]/g, '') // Remove non-word characters
      .replace(/[\s_-]+/g, '-') // Replace spaces and underscores with single hyphen
      .replace(/^-+|-+$/g, ''); // Trim leading/trailing hyphens

    document.getElementById('outputText').value = slug;
  }

  // Dark Mode Persistence Logic
  const toggleBtn = document.getElementById("theme-toggle");
  const applyTheme = (isDark) => {
    document.body.classList.toggle("dark", isDark);
    if(toggleBtn) toggleBtn.textContent = isDark ? "☀️" : "🌙";
    localStorage.setItem("theme", isDark ? "dark" : "light");
  };
  if (toggleBtn) toggleBtn.addEventListener("click", () => applyTheme(!document.body.classList.contains("dark")));
  if (localStorage.getItem("theme") === "dark") applyTheme(true);
</script>

</body>
</html>
