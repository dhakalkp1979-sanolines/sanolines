<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Word Counter & Text Analyzer – Sanolines</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<header>
  <div class="logo">
    <a href="/">
      <img src="../logo.svg" alt="Sanolines Logo">
    </a>
  </div>
  <nav>
    <a href="/">Home</a>
    <a href="/tools.html">Tools</a>
    <a href="/categories.html">Categories</a>
    <a href="/about.html">About</a>
    <a href="/disclaimer.html">Disclaimer</a>
    <button id="theme-toggle" style="background: none; border: none; cursor: pointer; font-size: 1.1rem; color: inherit;">🌙</button>
  </nav>
</header>

<main class="fade" style="max-width: 700px;">
  <h1>Word Counter & Text Analyzer</h1>
  <p style="color: var(--text-muted); margin-bottom: 24px;">Instantly count words, characters, sentences, and paragraphs in your text.</p>

  <div class="card" style="padding: 24px;">
    <div style="margin-bottom: 16px;">
      <textarea id="text-input" rows="8" placeholder="Type or paste your text here..." style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); resize: vertical; font-family: inherit;"></textarea>
    </div>

    <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; text-align: center;">
      <div style="background: var(--bg-primary); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);">
        <div style="font-size: 0.85rem; color: var(--text-muted);">Words</div>
        <div id="word-count" style="font-size: 1.4rem; font-weight: 700; margin-top: 4px;">0</div>
      </div>
      <div style="background: var(--bg-primary); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);">
        <div style="font-size: 0.85rem; color: var(--text-muted);">Characters</div>
        <div id="char-count" style="font-size: 1.4rem; font-weight: 700; margin-top: 4px;">0</div>
      </div>
      <div style="background: var(--bg-primary); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);">
        <div style="font-size: 0.85rem; color: var(--text-muted);">Sentences</div>
        <div id="sentence-count" style="font-size: 1.4rem; font-weight: 700; margin-top: 4px;">0</div>
      </div>
      <div style="background: var(--bg-primary); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);">
        <div style="font-size: 0.85rem; color: var(--text-muted);">Paragraphs</div>
        <div id="paragraph-count" style="font-size: 1.4rem; font-weight: 700; margin-top: 4px;">0</div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div>
    <a href="/about.html">About</a> | 
    <a href="/privacy.html">Privacy Policy</a> | 
    <a href="/terms.html">Terms</a> | 
    <a href="/disclaimer.html">Disclaimer</a>
  </div>
  <div style="margin-top: 8px;">© 2026 Sanolines — All Rights Reserved</div>
</footer>

<script>
  const textArea = document.getElementById("text-input");
  const wordCountDisplay = document.getElementById("word-count");
  const charCountDisplay = document.getElementById("char-count");
  const sentenceCountDisplay = document.getElementById("sentence-count");
  const paragraphCountDisplay = document.getElementById("paragraph-count");

  textArea.addEventListener("input", () => {
    const text = textArea.value;

    // Characters
    charCountDisplay.textContent = text.length;

    // Words
    const words = text.trim() ? text.trim().split(/\s+/) : [];
    wordCountDisplay.textContent = words.length;

    // Sentences (splitting by period, exclamation, or question mark)
    const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
    sentenceCountDisplay.textContent = sentences.length;

    // Paragraphs (splitting by line breaks)
    const paragraphs = text.split(/\n+/).filter(p => p.trim().length > 0);
    paragraphCountDisplay.textContent = paragraphs.length;
  });

  // Dark Mode Persistence Logic
  const toggleBtn = document.getElementById("theme-toggle");
  const applyTheme = (isDark) => {
    document.body.classList.toggle("dark", isDark);
    toggleBtn.textContent = isDark ? "☀️" : "🌙";
    localStorage.setItem("theme", isDark ? "dark" : "light");
  };
  if (toggleBtn) toggleBtn.addEventListener("click", () => applyTheme(!document.body.classList.contains("dark")));
  if (localStorage.getItem("theme") === "dark") applyTheme(true);
</script>

</body>
</html>
