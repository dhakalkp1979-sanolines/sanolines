<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Concrete Volume Calculator – Sanolines</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<header>
  <div class="logo">
    <a href="/">
      <img src="../logo.svg" alt="Sanolines Logo">
    </a>
  </div>
  <nav>
    <a href="/">Home</a>
    <a href="/tools.html">Tools</a>
    <a href="/categories.html">Categories</a>
    <a href="/about.html">About</a>
    <a href="/disclaimer.html">Disclaimer</a>
    <button id="theme-toggle" style="background: none; border: none; cursor: pointer; font-size: 1.1rem; color: inherit;">🌙</button>
  </nav>
</header>

<main class="fade" style="max-width: 650px;">
  <h1>Concrete Volume Calculator</h1>
  <p style="color: var(--text-muted); margin-bottom: 24px;">Calculate the volume of concrete required for slabs, footings, or columns in cubic yards and cubic meters.</p>

  <div class="card" style="padding: 24px;">
    <div style="margin-bottom: 16px;">
      <label style="display: block; font-size: 0.9rem; margin-bottom: 6px;">Thickness (inches)</label>
      <input type="number" id="thickness" placeholder="e.g. 4" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary);">
    </div>

    <div style="margin-bottom: 16px;">
      <label style="display: block; font-size: 0.9rem; margin-bottom: 6px;">Width (feet)</label>
      <input type="number" id="width" placeholder="e.g. 10" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary);">
    </div>

    <div style="margin-bottom: 20px;">
      <label style="display: block; font-size: 0.9rem; margin-bottom: 6px;">Length (feet)</label>
      <input type="number" id="length" placeholder="e.g. 20" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary);">
    </div>

    <button onclick="calculateConcrete()" style="background: var(--accent-gradient); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1rem;">Calculate Volume</button>

    <div id="concrete-results" style="margin-top: 24px; display: none;">
      <div style="border-top: 1px solid var(--border-color); padding-top: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; text-align: center;">
        <div style="background: var(--bg-primary); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);">
          <div style="font-size: 0.85rem; color: var(--text-muted);">Cubic Yards</div>
          <div id="cubic-yards" style="font-size: 1.2rem; font-weight: 700; margin-top: 4px; color: #2563eb;">0 yd³</div>
        </div>
        <div style="background: var(--bg-primary); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);">
          <div style="font-size: 0.85rem; color: var(--text-muted);">Cubic Meters</div>
          <div id="cubic-meters" style="font-size: 1.2rem; font-weight: 700; margin-top: 4px;">0 m³</div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div>
    <a href="/about.html">About</a> | 
    <a href="/privacy.html">Privacy Policy</a> | 
    <a href="/terms.html">Terms</a> | 
    <a href="/disclaimer.html">Disclaimer</a>
  </div>
  <div style="margin-top: 8px;">© 2026 Sanolines — All Rights Reserved</div>
</footer>

<script>
  function calculateConcrete() {
    const thicknessInches = parseFloat(document.getElementById("thickness").value);
    const widthFeet = parseFloat(document.getElementById("width").value);
    const lengthFeet = parseFloat(document.getElementById("length").value);
    const resultsContainer = document.getElementById("concrete-results");

    if (!thicknessInches || !widthFeet || !lengthFeet || thicknessInches <= 0 || widthFeet <= 0 || lengthFeet <= 0) {
      alert("Please enter valid positive values for all dimensions.");
      return;
    }

    const thicknessFeet = thicknessInches / 12;
    const cubicFeet = thicknessFeet * widthFeet * lengthFeet;
    const cubicYards = cubicFeet / 27;
    const cubicMeters = cubicFeet * 0.0283168;

    document.getElementById("cubic-yards").textContent = cubicYards.toFixed(2) + " yd³";
    document.getElementById("cubic-meters").textContent = cubicMeters.toFixed(2) + " m³";
    
    resultsContainer.style.display = "block";
  }

  // Dark Mode Persistence Logic
  const toggleBtn = document.getElementById("theme-toggle");
  const applyTheme = (isDark) => {
    document.body.classList.toggle("dark", isDark);
    toggleBtn.textContent = isDark ? "☀️" : "🌙";
    localStorage.setItem("theme", isDark ? "dark" : "light");
  };
  if (toggleBtn) toggleBtn.addEventListener("click", () => applyTheme(!document.body.classList.contains("dark")));
  if (localStorage.getItem("theme") === "dark") applyTheme(true);
</script>

</body>
</html>
