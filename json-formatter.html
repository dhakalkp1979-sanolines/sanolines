<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JSON Formatter & Validator – Sanolines</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<header>
  <div class="logo">
    <a href="/">
      <img src="../logo.svg" alt="Sanolines Logo">
    </a>
  </div>
  <nav>
    <a href="/">Home</a>
    <a href="/tools.html">Tools</a>
    <a href="/categories.html">Categories</a>
    <a href="/about.html">About</a>
    <a href="/disclaimer.html">Disclaimer</a>
    <button id="theme-toggle" style="background: none; border: none; cursor: pointer; font-size: 1.1rem; color: inherit;">🌙</button>
  </nav>
</header>

<main class="fade" style="max-width: 800px;">
  <h1>JSON Formatter & Validator</h1>
  <p style="color: var(--text-muted); margin-bottom: 24px;">Format, validate, and beautify your raw JSON data instantly.</p>

  <div class="card" style="padding: 24px;">
    <div style="margin-bottom: 16px;">
      <label style="display: block; font-size: 0.9rem; margin-bottom: 6px;">Input JSON</label>
      <textarea id="json-input" rows="8" placeholder='{"name": "Sanolines", "active": true}' style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); resize: vertical; font-family: monospace;"></textarea>
    </div>

    <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
      <button onclick="formatJSON()" style="background: var(--accent-gradient); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 0.95rem;">Format / Beautify</button>
      <button onclick="minifyJSON()" style="background: var(--border-color); color: var(--text-primary); border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 0.95rem;">Minify</button>
    </div>

    <div style="margin-bottom: 8px;">
      <label style="display: block; font-size: 0.9rem; margin-bottom: 6px;">Output Result</label>
      <textarea id="json-output" rows="8" readonly placeholder="Formatted output will appear here..." style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); resize: vertical; font-family: monospace;"></textarea>
    </div>

    <div id="status-msg" style="margin-top: 12px; font-size: 0.9rem; font-weight: 600; text-align: center;"></div>
  </div>
</main>

<footer>
  <div>
    <a href="/about.html">About</a> | 
    <a href="/privacy.html">Privacy Policy</a> | 
    <a href="/terms.html">Terms</a> | 
    <a href="/disclaimer.html">Disclaimer</a>
  </div>
  <div style="margin-top: 8px;">© 2026 Sanolines — All Rights Reserved</div>
</footer>

<script>
  function formatJSON() {
    const input = document.getElementById("json-input").value;
    const output = document.getElementById("json-output");
    const status = document.getElementById("status-msg");

    if (!input.trim()) {
      output.value = "";
      status.textContent = "Please enter JSON data.";
      status.style.color = "var(--text-muted)";
      return;
    }

    try {
      const parsed = JSON.parse(input);
      output.value = JSON.stringify(parsed, null, 2);
      status.textContent = "Valid JSON! Formatted successfully.";
      status.style.color = "#10b981"; // success green
    } catch (e) {
      output.value = "";
      status.textContent = "Invalid JSON: " + e.message;
      status.style.color = "#ef4444"; // error red
    }
  }

  function minifyJSON() {
    const input = document.getElementById("json-input").value;
    const output = document.getElementById("json-output");
    const status = document.getElementById("status-msg");

    if (!input.trim()) {
      output.value = "";
      status.textContent = "Please enter JSON data.";
      status.style.color = "var(--text-muted)";
      return;
    }

    try {
      const parsed = JSON.parse(input);
      output.value = JSON.stringify(parsed);
      status.textContent = "Valid JSON! Minified successfully.";
      status.style.color = "#10b981";
    } catch (e) {
      output.value = "";
      status.textContent = "Invalid JSON: " + e.message;
      status.style.color = "#ef4444";
    }
  }

  // Dark Mode Persistence Logic
  const toggleBtn = document.getElementById("theme-toggle");
  const applyTheme = (isDark) => {
    document.body.classList.toggle("dark", isDark);
    toggleBtn.textContent = isDark ? "☀️" : "🌙";
    localStorage.setItem("theme", isDark ? "dark" : "light");
  };
  if (toggleBtn) toggleBtn.addEventListener("click", () => applyTheme(!document.body.classList.contains("dark")));
  if (localStorage.getItem("theme") === "dark") applyTheme(true);
</script>

</body>
</html>
