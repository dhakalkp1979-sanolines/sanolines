<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loan EMI Calculator – Sanolines</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<header>
  <div class="logo">
    <a href="/">
      <img src="../logo.svg" alt="Sanolines Logo">
    </a>
  </div>
  <nav>
    <a href="/">Home</a>
    <a href="/tools.html">Tools</a>
    <a href="/categories.html">Categories</a>
    <a href="/about.html">About</a>
    <a href="/disclaimer.html">Disclaimer</a>
    <button id="theme-toggle" style="background: none; border: none; cursor: pointer; font-size: 1.1rem; color: inherit;">🌙</button>
  </nav>
</header>

<main class="fade" style="max-width: 650px;">
  <h1>Loan EMI Calculator</h1>
  <p style="color: var(--text-muted); margin-bottom: 24px;">Calculate your monthly loan payments, total interest, and total payment amounts easily.</p>

  <div class="card" style="padding: 24px;">
    <div style="margin-bottom: 16px;">
      <label style="display: block; font-size: 0.9rem; margin-bottom: 6px;">Loan Amount ($)</label>
      <input type="number" id="loan-amount" placeholder="e.g. 100000" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary);">
    </div>

    <div style="margin-bottom: 16px;">
      <label style="display: block; font-size: 0.9rem; margin-bottom: 6px;">Interest Rate (% per annum)</label>
      <input type="number" id="interest-rate" step="0.1" placeholder="e.g. 7.5" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary);">
    </div>

    <div style="margin-bottom: 20px;">
      <label style="display: block; font-size: 0.9rem; margin-bottom: 6px;">Loan Tenure (Years)</label>
      <input type="number" id="tenure-years" placeholder="e.g. 15" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary);">
    </div>

    <button onclick="calculateEMI()" style="background: var(--accent-gradient); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1rem;">Calculate EMI</button>

    <div id="emi-results" style="margin-top: 24px; display: none;">
      <div style="border-top: 1px solid var(--border-color); padding-top: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; text-align: center;">
        <div style="background: var(--bg-primary); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);">
          <div style="font-size: 0.85rem; color: var(--text-muted);">Monthly EMI</div>
          <div id="monthly-emi" style="font-size: 1.2rem; font-weight: 700; margin-top: 4px; color: #2563eb;">$0</div>
        </div>
        <div style="background: var(--bg-primary); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);">
          <div style="font-size: 0.85rem; color: var(--text-muted);">Total Interest</div>
          <div id="total-interest" style="font-size: 1.2rem; font-weight: 700; margin-top: 4px;">$0</div>
        </div>
        <div style="background: var(--bg-primary); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);">
          <div style="font-size: 0.85rem; color: var(--text-muted);">Total Payment</div>
          <div id="total-payment" style="font-size: 1.2rem; font-weight: 700; margin-top: 4px;">$0</div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div>
    <a href="/about.html">About</a> | 
    <a href="/privacy.html">Privacy Policy</a> | 
    <a href="/terms.html">Terms</a> | 
    <a href="/disclaimer.html">Disclaimer</a>
  </div>
  <div style="margin-top: 8px;">© 2026 Sanolines — All Rights Reserved</div>
</footer>

<script>
  function calculateEMI() {
    const principal = parseFloat(document.getElementById("loan-amount").value);
    const annualRate = parseFloat(document.getElementById("interest-rate").value);
    const years = parseFloat(document.getElementById("tenure-years").value);
    const resultsContainer = document.getElementById("emi-results");

    if (!principal || !annualRate || !years || principal <= 0 || annualRate <= 0 || years <= 0) {
      alert("Please enter valid positive values for all fields.");
      return;
    }

    const monthlyRate = annualRate / 12 / 100;
    const months = years * 12;

    const emi = (principal * monthlyRate * Math.pow(1 + monthlyRate, months)) / (Math.pow(1 + monthlyRate, months) - 1);
    const totalPayment = emi * months;
    const totalInterest = totalPayment - principal;

    document.getElementById("monthly-emi").textContent = "$" + emi.toFixed(2);
    document.getElementById("total-interest").textContent = "$" + totalInterest.toFixed(2);
    document.getElementById("total-payment").textContent = "$" + totalPayment.toFixed(2);
    
    resultsContainer.style.display = "block";
  }

  // Dark Mode Persistence Logic
  const toggleBtn = document.getElementById("theme-toggle");
  const applyTheme = (isDark) => {
    document.body.classList.toggle("dark", isDark);
    toggleBtn.textContent = isDark ? "☀️" : "🌙";
    localStorage.setItem("theme", isDark ? "dark" : "light");
  };
  if (toggleBtn) toggleBtn.addEventListener("click", () => applyTheme(!document.body.classList.contains("dark")));
  if (localStorage.getItem("theme") === "dark") applyTheme(true);
</script>

</body>
</html>
