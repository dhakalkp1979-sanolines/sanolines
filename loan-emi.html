<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loan EMI Calculator – Sanolines</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<header>
  <div class="logo">
    <a href="/">
      <img src="../logo.svg" alt="Sanolines Logo">
    </a>
  </div>
  <nav>
    <a href="/">Home</a>
    <a href="/tools.html">Tools</a>
    <a href="/categories.html">Categories</a>
    <a href="/about.html">About</a>
    <a href="/disclaimer.html">Disclaimer</a>
    <button id="theme-toggle" style="background: none; border: none; cursor: pointer; font-size: 1.1rem; color: inherit;">🌙</button>
  </nav>
</header>

<main class="fade" style="max-width: 600px;">
  <h1>Loan EMI Calculator</h1>
  <p style="color: var(--text-muted); margin-bottom: 24px;">Calculate your monthly loan payments, total interest, and total payment amount.</p>

  <div class="card" style="padding: 24px;">
    <div style="margin-bottom: 16px;">
      <label style="display: block; font-size: 0.9rem; margin-bottom: 6px;">Loan Amount ($)</label>
      <input type="number" id="loan-amount" placeholder="e.g. 100000" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary);">
    </div>

    <div style="margin-bottom: 16px;">
      <label style="display: block; font-size: 0.9rem; margin-bottom: 6px;">Annual Interest Rate (%)</label>
      <input type="number" step="0.1" id="interest-rate" placeholder="e.g. 7.5" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary);">
    </div>

    <div style="margin-bottom: 20px;">
      <label style="display: block; font-size: 0.9rem; margin-bottom: 6px;">Loan Tenure (Years)</label>
      <input type="number" id="tenure-years" placeholder="e.g. 15" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary);">
    </div>

    <button onclick="calculateEMI()" style="background: var(--accent-gradient); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1rem;">Calculate EMI</button>

    <div id="emi-result" style="margin-top: 24px; display: none;">
      <div style="background: var(--bg-primary); padding: 16px; border-radius: 8px; border: 1px solid var(--border-color); text-align: center; margin-bottom: 12px;">
        <div style="font-size: 0.85rem; color: var(--text-muted);">Monthly EMI</div>
        <div id="res-emi" style="font-size: 1.6rem; font-weight: 700; color: #2563eb; margin-top: 4px;">$0</div>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; text-align: center;">
        <div style="background: var(--bg-primary); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);">
          <div style="font-size: 0.8rem; color: var(--text-muted);">Total Interest</div>
          <div id="res-interest" style="font-size: 1.1rem; font-weight: 600; margin-top: 2px;">$0</div>
        </div>
        <div style="background: var(--bg-primary); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);">
          <div style="font-size: 0.8rem; color: var(--text-muted);">Total Payment</div>
          <div id="res-total" style="font-size: 1.1rem; font-weight: 600; margin-top: 2px;">$0</div>
        </div>
      </div>
    </div>
    
    <div id="emi-error" style="margin-top: 16px; color: #ef4444; font-size: 0.9rem; text-align: center; font-weight: 600;"></div>
  </div>
</main>

<footer>
  <div>
    <a href="/about.html">About</a> | 
    <a href="/privacy.html">Privacy Policy</a> | 
    <a href="/terms.html">Terms</a> | 
    <a href="/disclaimer.html">Disclaimer</a>
  </div>
  <div style="margin-top: 8px;">© 2026 Sanolines — All Rights Reserved</div>
</footer>

<script>
  function calculateEMI() {
    const p = parseFloat(document.getElementById("loan-amount").value);
    const annualRate = parseFloat(document.getElementById("interest-rate").value);
    const years = parseFloat(document.getElementById("tenure-years").value);
    
    const resultBox = document.getElementById("emi-result");
    const errorBox = document.getElementById("emi-error");

    if (!p || !annualRate || !years || p <= 0 || annualRate <= 0 || years <= 0) {
      errorBox.textContent = "Please enter valid positive numbers for all fields.";
      resultBox.style.display = "none";
      return;
    }

    errorBox.textContent = "";
    
    const r = annualRate / 12 / 100; // Monthly interest rate
    const n = years * 12; // Total months

    // EMI formula: [P x r x (1 + r)^n] / [(1 + r)^n – 1]
    const emi = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
    const totalPayment = emi * n;
    const totalInterest = totalPayment - p;

    document.getElementById("res-emi").textContent = "$" + emi.toFixed(2);
    document.getElementById("res-interest").textContent = "$" + totalInterest.toFixed(2);
    document.getElementById("res-total").textContent = "$" + totalPayment.toFixed(2);

    resultBox.style.display = "block";
  }

  // Dark Mode Persistence Logic
  const toggleBtn = document.getElementById("theme-toggle");
  const applyTheme = (isDark) => {
    document.body.classList.toggle("dark", isDark);
    toggleBtn.textContent = isDark ? "☀️" : "🌙";
    localStorage.setItem("theme", isDark ? "dark" : "light");
  };
  if (toggleBtn) toggleBtn.addEventListener("click", () => applyTheme(!document.body.classList.contains("dark")));
  if (localStorage.getItem("theme") === "dark") applyTheme(true);
</script>

</body>
</html>
