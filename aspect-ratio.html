<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aspect Ratio Calculator – Sanolines</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<header>
  <div class="logo">
    <a href="/">
      <img src="../logo.svg" alt="Sanolines Logo">
    </a>
  </div>
  <nav>
    <a href="/">Home</a>
    <a href="/tools.html">Tools</a>
    <a href="/categories.html">Categories</a>
    <a href="/about.html">About</a>
    <a href="/disclaimer.html">Disclaimer</a>
    <button id="theme-toggle" style="background: none; border: none; cursor: pointer; font-size: 1.1rem; color: inherit;">🌙</button>
  </nav>
</header>

<main class="fade" style="max-width: 650px;">
  <h1>Aspect Ratio Calculator</h1>
  <p style="color: var(--text-muted); margin-bottom: 24px;">Calculate image or video dimensions and scale proportions accurately.</p>

  <div class="card" style="padding: 24px;">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
      <div>
        <label style="display: block; font-size: 0.9rem; margin-bottom: 6px;">Original Width (px)</label>
        <input type="number" id="orig-width" placeholder="e.g. 1920" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary);">
      </div>
      <div>
        <label style="display: block; font-size: 0.9rem; margin-bottom: 6px;">Original Height (px)</label>
        <input type="number" id="orig-height" placeholder="e.g. 1080" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary);">
      </div>
    </div>

    <div style="margin-bottom: 20px;">
      <label style="display: block; font-size: 0.9rem; margin-bottom: 6px;">New Width (px) [Optional to scale height]</label>
      <input type="number" id="new-width" placeholder="e.g. 1280" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary);">
    </div>

    <button onclick="calculateAspectRatio()" style="background: var(--accent-gradient); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1rem;">Calculate Proportions</button>

    <div id="ratio-results" style="margin-top: 24px; display: none;">
      <div style="border-top: 1px solid var(--border-color); padding-top: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; text-align: center;">
        <div style="background: var(--bg-primary); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);">
          <div style="font-size: 0.85rem; color: var(--text-muted);">Aspect Ratio</div>
          <div id="result-ratio" style="font-size: 1.2rem; font-weight: 700; margin-top: 4px; color: #2563eb;">16:9</div>
        </div>
        <div style="background: var(--bg-primary); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);">
          <div style="font-size: 0.85rem; color: var(--text-muted);">Scaled Height</div>
          <div id="result-height" style="font-size: 1.2rem; font-weight: 700; margin-top: 4px;">0 px</div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div>
    <a href="/about.html">About</a> | 
    <a href="/privacy.html">Privacy Policy</a> | 
    <a href="/terms.html">Terms</a> | 
    <a href="/disclaimer.html">Disclaimer</a>
  </div>
  <div style="margin-top: 8px;">© 2026 Sanolines — All Rights Reserved</div>
</footer>

<script>
  function gcd(a, b) {
    return b === 0 ? a : gcd(b, a % b);
  }

  function calculateAspectRatio() {
    const w = parseInt(document.getElementById("orig-width").value);
    const h = parseInt(document.getElementById("orig-height").value);
    const newW = parseInt(document.getElementById("new-width").value);
    const resultsContainer = document.getElementById("ratio-results");

    if (!w || !h || w <= 0 || h <= 0) {
      alert("Please enter valid original width and height dimensions.");
      return;
    }

    const divisor = gcd(w, h);
    const ratioW = w / divisor;
    const ratioH = h / divisor;

    document.getElementById("result-ratio").textContent = `${ratioW}:${ratioH}`;

    if (newW && newW > 0) {
      const calculatedNewH = Math.round((newW * h) / w);
      document.getElementById("result-height").textContent = `${calculatedNewH} px`;
    } else {
      document.getElementById("result-height").textContent = `${h} px`;
    }

    resultsContainer.style.display = "block";
  }

  // Dark Mode Persistence Logic
  const toggleBtn = document.getElementById("theme-toggle");
  const applyTheme = (isDark) => {
    document.body.classList.toggle("dark", isDark);
    toggleBtn.textContent = isDark ? "☀️" : "🌙";
    localStorage.setItem("theme", isDark ? "dark" : "light");
  };
  if (toggleBtn) toggleBtn.addEventListener("click", () => applyTheme(!document.body.classList.contains("dark")));
  if (localStorage.getItem("theme") === "dark") applyTheme(true);
</script>

</body>
</html>
