<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video File Size Estimator – Sanolines</title>
  <link rel="icon" type="image/svg+xml" href="./logo.svg">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<header style="display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background: var(--bg-primary); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000;">
  <div class="logo">
    <a href="./index.html">
      <img src="./logo.svg" alt="Sanolines Logo" style="height: 32px; width: auto;">
    </a>
  </div>
  <nav style="display: flex; align-items: center; gap: 24px;">
    <a href="./index.html" style="text-decoration: none; color: var(--text-muted);">Home</a>
    <a href="./tools.html" style="text-decoration: none; color: var(--text-primary); font-weight: 600;">Tools</a>
    <a href="./categories.html" style="text-decoration: none; color: var(--text-muted);">Categories</a>
    <a href="./about.html" style="text-decoration: none; color: var(--text-muted);">About</a>
    <button id="theme-toggle" style="background: none; border: none; cursor: pointer; font-size: 1.1rem; color: inherit;">🌙</button>
  </nav>
</header>

<main style="padding: 40px 5%; max-width: 800px; margin: 0 auto;">
  <h1 style="font-size: 2.2rem; font-weight: 800; margin-bottom: 8px; color: var(--text-primary);">Video File Size Estimator</h1>
  <p style="color: var(--text-muted); margin-bottom: 30px;">Estimate the final rendered file size of your video project based on video and audio bitrates.</p>

  <div style="background: var(--bg-primary); border: 1px solid var(--border-color); padding: 30px; border-radius: 12px;">
    
    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-primary);">Video Bitrate (Mbps)</label>
      <input type="number" id="videoBitrate" placeholder="e.g., 5" step="0.1" style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-secondary, #f8fafc); color: inherit;">
    </div>

    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-primary);">Audio Bitrate (kbps)</label>
      <select id="audioBitrate" style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-secondary, #f8fafc); color: inherit;">
        <option value="128">128 kbps</option>
        <option value="192" selected>192 kbps</option>
        <option value="320">320 kbps</option>
        <option value="0">0 kbps (None)</option>
      </select>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 24px;">
      <div>
        <label style="display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-primary);">Duration (Minutes)</label>
        <input type="number" id="minutes" placeholder="e.g., 5" style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-secondary, #f8fafc); color: inherit;">
      </div>
      <div>
        <label style="display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-primary);">Duration (Seconds)</label>
        <input type="number" id="seconds" placeholder="e.g., 30" style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-secondary, #f8fafc); color: inherit;">
      </div>
    </div>

    <button onclick="estimateSize()" style="background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%;">Estimate File Size</button>

    <div id="result" style="margin-top: 24px; padding: 20px; background: var(--bg-secondary, #f1f5f9); border-radius: 8px; display: none; text-align: center;">
      <h3 style="margin: 0 0 10px 0; color: var(--text-primary);">Estimated File Size:</h3>
      <p id="outputSize" style="font-size: 1.8rem; font-weight: bold; color: #2563eb; margin: 0;"></p>
      <p id="outputDetails" style="color: var(--text-muted); margin-top: 8px; font-size: 0.95rem;"></p>
    </div>

  </div>
</main>

<footer style="background: #0f172a; color: #94a3b8; padding: 30px 5%; margin-top: 60px;">
  <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
    <div>
      <a href="./about.html" style="color: #94a3b8; text-decoration: none;">About</a> | 
      <a href="./privacy.html" style="color: #94a3b8; text-decoration: none;">Privacy Policy</a> | 
      <a href="./terms.html" style="color: #94a3b8; text-decoration: none;">Terms</a> | 
      <a href="./disclaimer.html" style="color: #94a3b8; text-decoration: none;">Disclaimer</a>
    </div>
    <div style="font-size: 0.85rem;">© 2026 Sanolines — All Rights Reserved</div>
  </div>
</footer>

<script>
  function estimateSize() {
    const videoMbps = parseFloat(document.getElementById('videoBitrate').value);
    const audioKbps = parseFloat(document.getElementById('audioBitrate').value);
    const mins = parseFloat(document.getElementById('minutes').value) || 0;
    const secs = parseFloat(document.getElementById('seconds').value) || 0;

    const totalSeconds = (mins * 60) + secs;

    if (!videoMbps || totalSeconds <= 0) {
      alert('Please provide a valid video bitrate and duration.');
      return;
    }

    // Total bits per second = (video Mbps * 1,000,000) + (audio kbps * 1,000)
    const totalBitsPerSec = (videoMbps * 1000000) + (audioKbps * 1000);
    const totalBits = totalBitsPerSec * totalSeconds;
    const totalBytes = totalBits / 8;
    
    const totalMB = totalBytes / (1024 * 1024);
    const totalGB = totalMB / 1024;

    const sizeString = totalGB >= 1 ? `${totalGB.toFixed(2)} GB` : `${totalMB.toFixed(1)} MB`;

    const resultDiv = document.getElementById('result');
    document.getElementById('outputSize').textContent = sizeString;
    document.getElementById('outputDetails').textContent = `Based on ${videoMbps} Mbps video and ${audioKbps} kbps audio for ${mins}m ${secs}s.`;
    resultDiv.style.display = 'block';
  }

  // Dark Mode Persistence Logic
  const toggleBtn = document.getElementById("theme-toggle");
  const applyTheme = (isDark) => {
    document.body.classList.toggle("dark", isDark);
    if(toggleBtn) toggleBtn.textContent = isDark ? "☀️" : "🌙";
    localStorage.setItem("theme", isDark ? "dark" : "light");
  };
  if (toggleBtn) toggleBtn.addEventListener("click", () => applyTheme(!document.body.classList.contains("dark")));
  if (localStorage.getItem("theme") === "dark") applyTheme(true);
</script>

</body>
</html>
